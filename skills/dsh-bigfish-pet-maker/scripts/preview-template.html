<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>角色包预览</title><style>body{font:16px system-ui;background:#f3f6f4;color:#23463e;max-width:860px;margin:40px auto;padding:20px}section{padding:24px;background:#fff;border:1px solid #dae5df;border-radius:22px;margin:20px 0}canvas{display:block;max-width:100%;margin:20px auto;background:repeating-conic-gradient(#eff2f0 0% 25%,white 0% 50%) 0 0/20px 20px}button,select{font:inherit;border:1px solid #bcd0c8;border-radius:9px;padding:9px;margin:4px}#list{display:flex;flex-wrap:wrap}small{color:#637f75}</style><h1 id="name"></h1><p id="description"></p><section><label>动作 <select id="action"></select></label><label><input type="checkbox" id="still">减弱动态</label><label id="homeControl" hidden><input type="checkbox" id="home">显示包内家园</label><label id="boundsControl" hidden><input type="checkbox" id="bounds">显示身体边界与落脚点</label><button id="background">切换深浅背景</button><button id="replay">重新播放</button><canvas id="canvas"></canvas><p id="info"></p><small id="guide" hidden>紫色虚线：body.bounds；绿色十字：body.foot。参考框不模拟插件舞台裁切，仍需在插件或桌面检查极端姿态是否裁边。</small></section><section><strong>基础状态与生活能力映射</strong><div id="list"></div><p>本页只逐段播放角色原始帧，可叠加已声明的包内家园背景。移动、饰品锚点佩戴、家园行为链和双宠完整链，以及用户设置、空闲间隔与工作事件，均需在插件或桌面实际预览。</p><small>未声明身体、移动、互动或生活能力的旧包仍可检阅已有素材；本页不会补造缺失能力。解锁限制仅展示次数，素材检阅不受成长锁限制。</small></section><script>
const pet=/*PET_PAYLOAD*/null;const nameEl=document.querySelector('#name');nameEl.textContent=pet.manifest.name;document.querySelector('#description').textContent=pet.manifest.description;
const select=document.querySelector('#action'),canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),still=document.querySelector('#still'),bounds=document.querySelector('#bounds');canvas.width=pet.manifest.canvas.width;canvas.height=pet.manifest.canvas.height;canvas.style.width=Math.min(320,canvas.width*2)+'px';
for(const a of pet.animations){const o=document.createElement('option');o.value=a.id;o.textContent=a.label+' · '+a.id;select.append(o);}select.value=pet.manifest.fallbacks.idle;
let start=performance.now(),dark=false;select.onchange=()=>start=performance.now();document.querySelector('#replay').onclick=()=>start=performance.now();document.querySelector('#background').onclick=()=>{dark=!dark;canvas.style.background=dark?'#20302f':'';};
for(const [role,id]of Object.entries(pet.manifest.fallbacks)){const b=document.createElement('button');b.textContent=role;b.onclick=()=>{select.value=id;start=performance.now();};document.querySelector('#list').append(b);}
for(const [kind,map]of Object.entries(pet.manifest.behaviors||{})){if(kind==='movement')continue;for(const [semantic,id]of Object.entries(map)){const b=document.createElement('button');b.textContent=kind+' · '+semantic;b.onclick=()=>{select.value=id;start=performance.now();};document.querySelector('#list').append(b);}}
if(pet.manifest.home&&pet.manifest.capabilities.includes('home'))document.querySelector('#homeControl').hidden=false;
if(pet.manifest.body){document.querySelector('#boundsControl').hidden=false;bounds.onchange=()=>document.querySelector('#guide').hidden=!bounds.checked;}
const images={};Promise.all(Object.entries(pet.assets).map(async([id,url])=>{const im=new Image();im.src=url;await im.decode();images[id]=im;})).then(()=>requestAnimationFrame(draw)).catch(e=>document.querySelector('#info').textContent=e.message);
function draw(now){const a=pet.animations.find(a=>a.id===select.value),total=a.frames.reduce((n,f)=>n+f.durationMs,0);let t=still.checked?0:a.loop?(now-start)%total:Math.min(now-start,total-1),f=a.frames[0];for(const candidate of a.frames){f=candidate;if(t<f.durationMs)break;t-=f.durationMs;}c.clearRect(0,0,canvas.width,canvas.height);if(document.querySelector('#home').checked&&pet.manifest.home)c.drawImage(images[pet.manifest.home.background],0,0,canvas.width,canvas.height);c.drawImage(images[f.asset],...f.rect,0,0,canvas.width,canvas.height);if(f.sign){const s=f.sign;c.save();c.translate(s.x,s.y);c.rotate(s.angle*Math.PI/180);c.font='12px system-ui';c.fillStyle='#234';c.textAlign='center';c.fillText('我在这里～',s.width/2,s.height*.75,s.width*.9);c.restore();}if(bounds.checked&&pet.manifest.body){const {bounds:b,foot:f}=pet.manifest.body,line=Math.max(1,canvas.width/160),mark=Math.max(3,line*2);c.save();c.lineWidth=line;c.strokeStyle='#9c408b';c.setLineDash([mark,mark]);c.strokeRect(b.x,b.y,b.width,b.height);c.setLineDash([]);c.strokeStyle='#16866b';c.beginPath();c.moveTo(f.x-mark,f.y);c.lineTo(f.x+mark,f.y);c.moveTo(f.x,f.y-mark);c.lineTo(f.x,f.y+mark);c.stroke();c.restore();}canvas.dataset.motion=a.id;document.querySelector('#info').textContent=`${pet.animations.length} 个动作 · 当前 ${a.frames.length} 帧 · ${a.tags.join(' / ')} · 强度 ${a.intensity} · 解锁次数 ${a.unlockAt||0}（本预览可检阅全部素材）`;requestAnimationFrame(draw);}
</script></html>
