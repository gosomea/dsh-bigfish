<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>角色包预览</title><style>body{font:16px system-ui;background:#f3f6f4;color:#23463e;max-width:860px;margin:40px auto;padding:20px}section{padding:24px;background:#fff;border:1px solid #dae5df;border-radius:22px;margin:20px 0}canvas{display:block;max-width:100%;margin:20px auto;background:repeating-conic-gradient(#eff2f0 0% 25%,white 0% 50%) 0 0/20px 20px}button,select{font:inherit;border:1px solid #bcd0c8;border-radius:9px;padding:9px;margin:4px}#list{display:flex;flex-wrap:wrap}small{color:#637f75}</style><h1 id="name"></h1><p id="description"></p><section><label>动作 <select id="action"></select></label><label><input type="checkbox" id="still">减弱动态</label><button id="background">切换深浅背景</button><button id="replay">重新播放</button><canvas id="canvas"></canvas><p id="info"></p></section><section><strong>基础状态</strong><div id="list"></div><small>这是动作素材预览。插件里的“预览当前效果”另外验证用户设置、空闲间隔和工作事件。</small></section><script>
const pet=/*PET_PAYLOAD*/null;const nameEl=document.querySelector('#name');nameEl.textContent=pet.manifest.name;document.querySelector('#description').textContent=pet.manifest.description;
const select=document.querySelector('#action'),canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),still=document.querySelector('#still');canvas.width=pet.manifest.canvas.width;canvas.height=pet.manifest.canvas.height;canvas.style.width=Math.min(320,canvas.width*2)+'px';
for(const a of pet.animations){const o=document.createElement('option');o.value=a.id;o.textContent=a.label+' · '+a.id;select.append(o);}select.value=pet.manifest.fallbacks.idle;
let start=performance.now(),dark=false;select.onchange=()=>start=performance.now();document.querySelector('#replay').onclick=()=>start=performance.now();document.querySelector('#background').onclick=()=>{dark=!dark;canvas.style.background=dark?'#20302f':'';};
for(const [role,id]of Object.entries(pet.manifest.fallbacks)){const b=document.createElement('button');b.textContent=role;b.onclick=()=>{select.value=id;start=performance.now();};document.querySelector('#list').append(b);}
const images={};Promise.all(Object.entries(pet.assets).map(async([id,url])=>{const im=new Image();im.src=url;await im.decode();images[id]=im;})).then(()=>requestAnimationFrame(draw)).catch(e=>document.querySelector('#info').textContent=e.message);
function draw(now){const a=pet.animations.find(a=>a.id===select.value),total=a.frames.reduce((n,f)=>n+f.durationMs,0);let t=still.checked?0:a.loop?(now-start)%total:Math.min(now-start,total-1),f=a.frames[0];for(const candidate of a.frames){f=candidate;if(t<f.durationMs)break;t-=f.durationMs;}c.clearRect(0,0,canvas.width,canvas.height);c.drawImage(images[f.asset],...f.rect,0,0,canvas.width,canvas.height);if(f.sign){const s=f.sign;c.save();c.translate(s.x,s.y);c.rotate(s.angle*Math.PI/180);c.font='12px system-ui';c.fillStyle='#234';c.textAlign='center';c.fillText('我在这里～',s.width/2,s.height*.75,s.width*.9);c.restore();}canvas.dataset.motion=a.id;document.querySelector('#info').textContent=`${pet.animations.length} 个动作 · 当前 ${a.frames.length} 帧 · ${a.tags.join(' / ')} · 强度 ${a.intensity}`;requestAnimationFrame(draw);}
</script></html>
